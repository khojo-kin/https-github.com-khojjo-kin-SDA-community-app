<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{csp_meta}}">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{#if canonical}}<link rel="canonical" href="{{canonical}}">
{{/if}}{{#if noindex}}<meta name="robots" content="noindex">
{{/if}}<meta name="theme-color" content="#0c2118">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{base}}/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{base}}/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="{{base}}/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="{{base}}/apple-touch-icon.png">
<link rel="manifest" href="{{base}}/site.webmanifest">
<link rel="stylesheet" href="{{base}}/assets/css/site.css?v={{css_version}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Community">
<meta property="og:locale" content="en_GB">
<meta property="og:title" content="{{social_title}}">
<meta property="og:description" content="{{description}}">
{{#if canonical}}<meta property="og:url" content="{{canonical}}">
{{/if}}<meta property="og:image" content="{{site_url}}/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Community app icon and name on deep green, beside an arched church window filled with light.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{social_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site_url}}/og-image.png">
<meta name="twitter:image:alt" content="The Community app icon and name on deep green, beside an arched church window filled with light.">
{{#if app_store_id}}<meta name="apple-itunes-app" content="app-id={{app_store_id}}">
{{/if}}</head>
<body>
{{{header}}}
<main id="main" tabindex="-1">
{{{content}}}
</main>
{{{footer}}}
</body>
</html>
